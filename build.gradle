plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def modVersion = project.mod_version
def modId = project.mod_id
def modName = project.mod_name
def modAuthor = project.mod_author
def modDescription = project.mod_description
def minecraftVersion = project.minecraft_version
def neoForgeVersion = project.neoforge_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        industrialcrops {
            sourceSet sourceSets.main
        }
        carrote {
            sourceSet sourceSets.main
        }
        carrote_curios {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    if (!providers.gradleProperty('withoutCurios').map { it.toBoolean() }.getOrElse(false)) {
        runtimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.9.2"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filteringCharset = 'UTF-8'
    inputs.property 'version', modVersion

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            version: modVersion,
            mod_id: modId,
            mod_name: modName,
            mod_author: modAuthor,
            mod_description: modDescription,
            minecraft_version: minecraftVersion,
            neoforge_version: neoForgeVersion
        ])
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
